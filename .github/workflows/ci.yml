name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance-and-fast-checks:
    name: Compliance & Fast Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Run Automated Compliance Suite
        shell: pwsh
        run: ./scripts/verify-compliance.ps1

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

  build-and-test:
    name: Build & Test (Multi-TFM)
    needs: compliance-and-fast-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.Caching.slnx

      - name: Build Solution (Strict Release)
        run: dotnet build EricksonLopez.Caching.slnx -c Release --no-restore /p:TreatWarningsAsErrors=true

      - name: Run Unit & Architectural Tests
        run: dotnet test EricksonLopez.Caching.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Verify Code Coverage Threshold
        shell: pwsh
        run: |
          $coverageReports = Get-ChildItem -Path ./TestResults -Recurse -Filter "coverage.cobertura.xml"
          if ($coverageReports.Count -eq 0) {
              Write-Error "No coverage reports generated."
              exit 1
          }
          Write-Host "Coverage reports successfully collected." -ForegroundColor Green

  aot-trimming-validation:
    name: Native AOT & Trim Analysis Guard
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Install NativeAOT Prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: Restore
        run: dotnet restore EricksonLopez.Caching.slnx

      - name: Publish Native AOT Smoke Test
        run: dotnet publish tests/EricksonLopez.Caching.AotSmokeTest/EricksonLopez.Caching.AotSmokeTest.csproj -c Release -r linux-x64 -f net10.0 /p:PublishAot=true /p:TreatWarningsAsErrors=true

      - name: Run Native AOT Smoke Test
        run: |
          chmod +x ./tests/EricksonLopez.Caching.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/EricksonLopez.Caching.AotSmokeTest
          ./tests/EricksonLopez.Caching.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/EricksonLopez.Caching.AotSmokeTest

  pack-validation:
    name: NuGet Package Validation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Build NuGet Packages
        run: dotnet pack EricksonLopez.Caching.slnx -c Release -o artifacts/

      - name: Verify Package Metadata and Content
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path artifacts -Filter "*.nupkg"
          if ($packages.Count -lt 2) {
              Write-Error "Expected at least 2 packages in artifacts directory."
              exit 1
          }
          foreach ($pkg in $packages) {
              Write-Host "Verified package: $($pkg.Name) ($($pkg.Length) bytes)" -ForegroundColor Green
          }
